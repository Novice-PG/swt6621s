# Load order for the SWT6621S SDIO stack on mainline sunxi kernels.
#
# Do not have systemd load skw_sdio_lite from modules-load.d: that happens
# about one second after boot, while the SDIO controller is still settling.
# The first CMD53 block write of the firmware download then fails with
# -EBUSY, the driver aborts the transfer and the chip stays wedged:
#
#   [SKWSDIO ERROR] skw_sdio_sdma_write ret = -16
#   ... -110 timeouts
#   sv6160lite probe failed with error -16
#
# On a board that boots from SD/eMMC this can also stall the boot. Loading
# the modules ~20 s later works reliably, so keep udev from autoloading them
# and use swt6621s-wifi.timer instead.
#
# `blacklist` only suppresses alias-based autoloading; an explicit
# `modprobe skw_sdio_lite` from the timer still works.
blacklist skw_sdio_lite
blacklist swt6621s_wifi
blacklist skwbt
