PACKAGE_NAME="swt6621s"
PACKAGE_VERSION="1.0.2"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src CC=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/cc-wrapper.sh modules"
PRE_BUILD="chmod 755 ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/cc-wrapper.sh"

BUILT_MODULE_NAME[0]="skw_sdio_lite"
BUILT_MODULE_LOCATION[0]="src/seekwaveplatform_lite"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="swt6621s_wifi"
BUILT_MODULE_LOCATION[1]="src/swt6621s_wifi"
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="skwbt"
BUILT_MODULE_LOCATION[2]="src/swtbt4l"
DEST_MODULE_LOCATION[2]="/updates"

AUTOINSTALL="yes"
